<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="medallion-bg" cx="32%" cy="26%" r="76%">
      <stop offset="0%" stop-color="#2B6CB0" />
      <stop offset="55%" stop-color="#2357A4" />
      <stop offset="100%" stop-color="#15376B" />
    </radialGradient>
    <linearGradient id="gold-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="bee-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="45%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="wing-pearl" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.96" />
      <stop offset="100%" stop-color="#BFDBFE" stop-opacity="0.82" />
    </linearGradient>
    <filter id="drop-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#091936" flood-opacity="0.38" />
    </filter>
  </defs>

  <!-- Outer Rounded App Icon Tile -->
  <rect width="512" height="512" rx="120" fill="#0F172A" />

  <!-- Main Royal Blue Medallion with Golden Rim -->
  <circle cx="256" cy="256" r="224" fill="url(#medallion-bg)" stroke="url(#gold-rim)" stroke-width="18" />
  <circle cx="256" cy="256" r="196" fill="none" stroke="#93C5FD" stroke-opacity="0.22" stroke-width="5" />

  <!-- Subtle Honeycomb Pattern in Upper-Left -->
  <g stroke="#60A5FA" stroke-opacity="0.16" stroke-width="5" fill="none">
    <polygon points="122,122 148,107 174,122 174,152 148,167 122,152" />
    <polygon points="174,122 200,107 226,122 226,152 200,167 174,152" />
    <polygon points="148,167 174,152 200,167 200,197 174,212 148,197" />
  </g>

  <!-- Back Layer of Golden Swooping Trail -->
  <path d="M 88 346 C 118 386, 196 366, 246 280" fill="none" stroke="url(#gold-rim)" stroke-width="16" stroke-linecap="round" />

  <!-- Bold White Indian Rupee (₹) Symbol (Open on the left) -->
  <g filter="url(#drop-shadow)">
    <path d="M 130 138 H 322" stroke="#FFFFFF" stroke-width="34" stroke-linecap="round" />
    <path d="M 130 202 H 306" stroke="#FFFFFF" stroke-width="29" stroke-linecap="round" />
    <path d="M 195 138 H 228 C 280 138, 305 167, 305 204 C 305 241, 278 270, 222 270 H 172 L 305 395" fill="none" stroke="#FFFFFF" stroke-width="34" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Front Layer of Golden Swooping Trail Threading Through the ₹ Loop -->
  <path d="M 226 260 C 256 220, 282 190, 332 178" fill="none" stroke="#FDE047" stroke-width="18" stroke-linecap="round" />
  <path d="M 105 362 C 165 386, 246 276, 322 184" fill="none" stroke="#FEF08A" stroke-width="7.5" stroke-dasharray="15 20" stroke-linecap="round" opacity="0.88" />

  <!-- Overlap Clip of ₹ Top Bar so the Bee Weaves Through the Loop -->
  <path d="M 230 138 H 312" stroke="#FFFFFF" stroke-width="34" stroke-linecap="round" />

  <!-- Golden Honeybee Swooping Out of the ₹ Loop -->
  <g filter="url(#drop-shadow)">
    <!-- Wings -->
    <ellipse cx="312" cy="126" rx="31" ry="53" transform="rotate(-28 312 126)" fill="url(#wing-pearl)" stroke="#FFFFFF" stroke-width="5.5" />
    <ellipse cx="350" cy="133" rx="28" ry="48" transform="rotate(18 350 133)" fill="url(#wing-pearl)" stroke="#FFFFFF" stroke-width="5.5" />

    <!-- Stinger -->
    <path d="M 284 202 L 262 216 L 290 188 Z" fill="#0F172A" />

    <!-- Tilted Golden Bee Body & Stripes -->
    <g transform="rotate(-24 342 180)">
      <ellipse cx="338" cy="180" rx="58" ry="39" fill="url(#bee-gold)" stroke="#0F172A" stroke-width="9" />
      <path d="M 310 145 Q 318 180 310 215" stroke="#0F172A" stroke-width="16" stroke-linecap="round" fill="none" />
      <path d="M 339 142 Q 347 180 339 218" stroke="#0F172A" stroke-width="17" stroke-linecap="round" fill="none" />
      <path d="M 367 148 Q 373 180 367 212" stroke="#0F172A" stroke-width="14" stroke-linecap="round" fill="none" />
      <circle cx="381" cy="171" r="8" fill="#0F172A" />
      <circle cx="384" cy="168" r="3.2" fill="#FFFFFF" />
      <path d="M 386 155 Q 401 131 417 135" fill="none" stroke="#FEF08A" stroke-width="7.5" stroke-linecap="round" />
      <circle cx="418" cy="135" r="6.5" fill="#FDE047" />
    </g>
  </g>

  <!-- Sparkle Star -->
  <path d="M 414 92 L 421 110 L 439 117 L 421 124 L 414 142 L 407 124 L 389 117 L 407 110 Z" fill="#FEF08A" />
</svg>

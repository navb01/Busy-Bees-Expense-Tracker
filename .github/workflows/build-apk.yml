name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Setup Java JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Dependencies
        run: npm install

      - name: Build Web Assets
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
        run: npm run build

      - name: Initialize Android Platform and Apply BB App Icon
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

          # Apply BB app icon across all Android mipmap directories
          ICON_SRC="public/pwa-512x512.png"
          if [ -f "public/assets/aistudio/BB_logo_512x512_a9c1fff0.png" ]; then
            ICON_SRC="public/assets/aistudio/BB_logo_512x512_a9c1fff0.png"
          fi
          for dir in android/app/src/main/res/mipmap-mdpi android/app/src/main/res/mipmap-hdpi android/app/src/main/res/mipmap-xhdpi android/app/src/main/res/mipmap-xxhdpi android/app/src/main/res/mipmap-xxxhdpi; do
            if [ -d "$dir" ]; then
              cp "$ICON_SRC" "$dir/ic_launcher.png"
              cp "$ICON_SRC" "$dir/ic_launcher_round.png"
              cp "$ICON_SRC" "$dir/ic_launcher_foreground.png"
            fi
          done

      - name: Make Gradlew Executable
        run: chmod +x ./android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: Busy-Bees-Expense-Tracker-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

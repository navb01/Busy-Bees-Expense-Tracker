name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Setup Java JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Dependencies
        run: npm install

      - name: Build Web Assets
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
        run: npm run build

      - name: Sync Android Platform and Apply Rupee-Bee App Icon
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

          # Rasterize public/icon.svg for legacy mipmap PNGs while keeping vector ic_launcher_foreground.xml intact
          sudo apt-get update && sudo apt-get install -y librsvg2-bin
          rsvg-convert -w 512 -h 512 public/icon.svg -o public/pwa-512x512.png
          for dir in android/app/src/main/res/mipmap-mdpi android/app/src/main/res/mipmap-hdpi android/app/src/main/res/mipmap-xhdpi android/app/src/main/res/mipmap-xxhdpi android/app/src/main/res/mipmap-xxxhdpi; do
            if [ -d "$dir" ]; then
              cp public/pwa-512x512.png "$dir/ic_launcher.png"
              cp public/pwa-512x512.png "$dir/ic_launcher_round.png"
            fi
          done

      - name: Prepare Release Keystore (Play Protect Compliant v1/v2/v3 Signing)
        run: |
          if [ ! -f "android/app/busybees-release.jks" ]; then
            keytool -genkeypair -v \
              -keystore android/app/busybees-release.jks \
              -alias busybees \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "BusyBeesRelease2026!" \
              -keypass "BusyBeesRelease2026!" \
              -dname "CN=Busy Bees Expense Tracker, OU=Mobile Engineering, O=Busy Bees, L=Bengaluru, S=KA, C=IN"
          fi

      - name: Make Gradlew Executable
        run: chmod +x ./android/gradlew

      - name: Build Signed Release Android APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/Busy-Bees-Expense-Tracker.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: Busy-Bees-Expense-Tracker-APK
          path: android/app/build/outputs/apk/release/Busy-Bees-Expense-Tracker.apk

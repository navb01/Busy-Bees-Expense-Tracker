<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Busy Bees Expense Tracker</title>
    <meta name="description" content="A simple place for your everyday money. Record what comes in and what goes out, without the noise." />
    <meta property="og:title" content="Busy Bees Expense Tracker" />
    <meta property="og:description" content="A simple place for your everyday money. Record what comes in and what goes out, without the noise." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#2563EB" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="BusyBees" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js', { scope: '/' })
            .then(function(reg) {
              console.log('Busy Bees Service Worker active:', reg.scope);
            })
            .catch(function(err) {
              console.warn('Service Worker registration failed:', err);
            });
        });
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <style>
      .bb-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #f8fafc;
        user-select: none;
      }
      .bb-logo {
        position: relative;
        width: 240px;
        height: 240px;
        border-radius: 9999px;
        border: 8px solid #2357A4;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #ffffff;
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
      }
      .bb-logo-text {
        color: #2357A4;
        font-weight: 800;
        font-size: 76px;
        letter-spacing: -1.5px;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      .bb-logo-dot {
        position: absolute;
        top: 6px;
        right: 6px;
        width: 44px;
        height: 44px;
        border-radius: 9999px;
        background-color: #f59e0b;
        border: 3px solid #ffffff;
      }
      .bb-dots {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 48px;
      }
      .bb-dots span {
        width: 12px;
        height: 12px;
        border-radius: 9999px;
        background-color: #2357A4;
        animation: bb-bounce 900ms infinite ease-in-out;
      }
      .bb-dots span:nth-child(2) {
        animation-delay: 200ms;
      }
      .bb-dots span:nth-child(3) {
        animation-delay: 400ms;
      }
      @keyframes bb-bounce {
        0%, 80%, 100% {
          transform: translateY(0);
        }
        40% {
          transform: translateY(-8px);
        }
      }
    </style>
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased selection:bg-blue-100 selection:text-blue-900">
    <div id="root">
      <div class="bb-splash">
        <div class="bb-logo">
          <span class="bb-logo-text">BB</span>
          <span class="bb-logo-dot"></span>
        </div>
        <div class="bb-dots">
          <span></span>
          <span></span>
          <span></span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
